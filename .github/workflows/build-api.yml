name: build-api

# CI/CD for the ingest/query API: on every push to main that touches api/, run the test
# suite, build the Docker image, push it to GHCR, and roll it out to the k3s cluster.
#
# ⚠️ THIS PIPELINE USED TO STOP AT "PUSH", AND THAT WAS A SILENT FAILURE (design docs 09).
# A Deployment pinned to a MUTABLE tag (:latest) does not change when the tag is repointed --
# nothing in the cluster is watching a registry -- and a running pod never re-pulls. So a green
# CI run meant "the image exists", not "the image is serving". It bit twice: the search endpoint
# went live 45 minutes after its pod started, and /stats/sufficiency 404'd in production while
# /stats/ranking happily returned 200. Both times /health was green.
#
# The deploy job below closes that gap, and -- more importantly -- ENDS IN A CHECK A STALE POD
# CANNOT PASS. See its comments.
on:
  push:
    branches: [main]
    # ⚠️ THIS LIST IS "WHAT THE API IMAGE IS BUILT FROM", NOT "THE api/ FOLDER".
    #
    # It originally said `api/**` only, and that omitted the ROOT LOCKFILE — which the test job
    # installs from. The consequence was found the hard way on 2026-08-09: a commit that fixed a CI
    # failure by editing `package-lock.json` triggered NO RUN AT ALL, so the fix could never build
    # itself. Nothing errored; the Actions tab was simply empty.
    #
    # That silence is the failure mode to notice. A path filter that omits a build input doesn't
    # warn — "no run was queued" and "nothing needed doing" are indistinguishable from outside,
    # which puts it in the same family as a mutable tag that never triggers a rollout: the system
    # is working exactly as configured, and the configuration is pointed at the wrong thing.
    #
    # Rule for editing this list: if changing a file can change what ends up in the image or what
    # the tests run against, it belongs here.
    paths:
      - 'api/**'
      - 'package-lock.json'          # the tree the test job installs from
      - 'package.json'               # workspace definitions
      - '.github/workflows/build-api.yml'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/omwanalytics-api
  # Not a secret — an AWS region is public information, and hardcoding it here beats a repo
  # variable nobody can see when reading the workflow. It cost a debugging session on 2026-08-09
  # when the EC2 console opened on the default us-east-1 and showed no instances (09 §2).
  AWS_REGION: us-east-2

jobs:
  # ---------------------------------------------------------------------------
  # 1. TEST -- the gate that used to be a human
  # ---------------------------------------------------------------------------
  # Until now the only thing standing between a broken commit and production was that a person
  # had to SSH in and restart the deployment by hand, and would presumably not do that with a
  # red suite. Automating the rollout deletes that pause, so the suite has to run here instead.
  test:
    runs-on: ubuntu-latest
    services:
      # 6 of the 7 test files are pure, but corpus/ingest.test.ts talks to Postgres and needs
      # the vector extension -- hence pgvector's image rather than stock postgres.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omwa_test
        ports:
          - 5432:5432
        # Without a health check the job races the database: `npm test` can connect before
        # Postgres finishes initialising and fail for a reason that has nothing to do with the code.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/omwa_test
      DATABASE_SSL: 'false'   # local container, unlike RDS which requires TLS
    defaults:
      run:
        working-directory: ./api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `npm install`, not `npm ci`: the lockfile lives at the monorepo root, not in api/.
      # Same compromise the Dockerfile documents.
      - name: Install dependencies
        run: npm install

      # tsc IS the typecheck gate -- there is no separate lint job, and the image build would
      # fail here anyway. Failing now costs 30s instead of a whole build.
      - name: Typecheck + compile
        run: npm run build

      # The same migration entrypoint the deployment's initContainer runs, so CI exercises the
      # real migration path rather than a drizzle-kit shortcut that production never takes.
      - name: Apply migrations
        run: node dist/jobs/migrate.js

      - name: Test
        run: npm test

  # ---------------------------------------------------------------------------
  # 2. BUILD + PUSH
  # ---------------------------------------------------------------------------
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # lets the auto GITHUB_TOKEN push to GHCR — no PAT needed
    outputs:
      # The immutable tag the deploy job pins the Deployment to. Published as a job output so
      # the tag that gets BUILT and the tag that gets DEPLOYED are the same string, computed
      # once. Deriving it twice would let them drift, and a deploy job pinning a tag that was
      # never pushed fails in a confusing place.
      image_tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short sha tag
        id: sha
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Derive tags/labels: a stable :latest plus an immutable :sha-<short> so every
      # deploy is traceable to a commit. :latest is kept only for convenience/manual pulls —
      # the Deployment is pinned to the immutable tag by the deploy job below.
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.sha.outputs.tag }}

      - name: Build timestamp
        id: ts
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the commit into the image so GET /version can prove WHICH BUILD is serving
          # traffic. The OCI labels above are metadata ABOUT the image and are invisible to the
          # running process; these become env vars the code can actually read and report.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.ts.outputs.value }}
          # (Layer caching via type=gha was removed: GitHub retired the v1 Actions
          # Cache backend in early 2025 and the exporter failed the job. Saves only
          # ~30-60s for this small image. A registry-based cache is a future option.)

  # ---------------------------------------------------------------------------
  # 3. DEPLOY -- repoint the Deployment, then PROVE the new code is serving
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Guard against a manual workflow_dispatch from a feature branch quietly shipping to prod.
    if: github.ref == 'refs/heads/main'
    permissions:
      # ⭐ REQUIRED FOR OIDC. This lets the job mint a short-lived GitHub identity token that AWS
      # exchanges for temporary credentials. Without it, configure-aws-credentials fails with a
      # confusing "Credentials could not be loaded" -- the token endpoint simply is not there.
      id-token: write
      contents: read
    steps:
      # ── HOW THIS REACHES THE BOX, AND WHY THERE IS NO SSH HERE ────────────────────────────────
      #
      # The first attempt used SSH and could not connect: the security group allowed port 22 from
      # a single /32 (the maintainer's home IP) and GitHub-hosted runners have rotating addresses.
      # That was not a misconfiguration -- the restriction was doing its job. The genuine choice
      # was to WIDEN THE NETWORK (open 22 to the world, losing a layer of defence) or to CHANGE
      # THE CHANNEL so nothing needs widening. This is the second.
      #
      # SSM inverts the direction of travel: the agent on the instance polls AWS outbound, so
      # there is NO INBOUND PORT AT ALL and 22 stays locked to one /32. Paired with OIDC there is
      # also no long-lived credential in this repo -- DEPLOY_SSH_KEY, a standing key to a
      # production box, is deleted rather than merely well-guarded.
      #
      # What replaced it: a role AWS issues credentials to only when the caller proves it is a
      # push to main of this repository, scoped to ssm:SendCommand on ONE instance and ONE
      # document. A leaked GitHub token cannot open a shell; it can deploy an image.
      # ── DIAGNOSTIC: what claims are we actually presenting? ───────────────────────────────────
      #
      # `Not authorized to perform sts:AssumeRoleWithWebIdentity` means STS validated the token and
      # the ROLE'S TRUST POLICY refused it — but it will not say which condition failed. Without
      # this you are comparing a policy you can read against a token you cannot, which is guesswork.
      #
      # ⚠️ Prints the CLAIMS ONLY, never the token. `sub`, `aud` and `repository` are public facts
      # about the run; the JWT is a bearer credential and is piped, never echoed and never passed
      # as an argv (which would expose it in the runner's process list).
      - name: Show the OIDC claims being presented
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
          | node -e '
              let s="";
              process.stdin.on("data", d => s += d).on("end", () => {
                const jwt = JSON.parse(s).value;
                const p = JSON.parse(
                  Buffer.from(jwt.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"), "base64").toString()
                );
                console.log("sub:        " + p.sub);
                console.log("aud:        " + p.aud);
                console.log("repository: " + p.repository);
                console.log("ref:        " + p.ref);
                console.log("issuer:     " + p.iss);
                console.log("");
                console.log("The trust policy must match sub and aud EXACTLY (both case-sensitive),");
                console.log("and Principal.Federated must be the provider ARN for that issuer.");
              });
            '

      - name: Assume the deploy role (OIDC — nothing stored in this repo)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: omwa-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Roll out ${{ needs.build-and-push.outputs.image_tag }}
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_REPO: ${{ env.IMAGE }}
        run: |
          set -euo pipefail

          if [ -z "${INSTANCE_ID:-}" ]; then
            echo "::error::EC2_INSTANCE_ID secret is empty or missing."
            exit 1
          fi
          IMAGE="${IMAGE_REPO}:${IMAGE_TAG}"

          # Is the agent actually registered? An instance with no IAM instance profile is INVISIBLE
          # to SSM, and send-command then fails with a generic InvalidInstanceId that reads like a
          # typo in the instance id. Asking first turns that into a sentence naming the real cause.
          ping=$(aws ssm describe-instance-information \
                   --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
                   --query 'InstanceInformationList[0].PingStatus' \
                   --output text 2>/dev/null || echo None)
          if [ "$ping" != "Online" ]; then
            echo "::error::Instance ${INSTANCE_ID} is not registered with SSM (PingStatus=${ping}). It needs an IAM instance profile containing AmazonSSMManagedInstanceCore; after attaching one the agent can take a few minutes, or restart it with: sudo snap restart amazon-ssm-agent"
            exit 1
          fi
          echo "SSM agent Online"

          # Parameters go in a FILE, not inline. These commands contain quotes and shell
          # metacharacters, and threading them through --parameters key=value is the kind of
          # quoting that works until a tag contains something unexpected and then fails obscurely.
          # ⚠️ `set -eu`, NOT `set -euo pipefail`. AWS-RunShellScript executes these with /bin/sh,
          # which on Ubuntu is DASH, not bash — and dash has no `pipefail`, so that line aborts the
          # script at line 1 with "Illegal option -o pipefail" before kubectl is ever reached.
          # Nothing here pipes, so pipefail was buying nothing anyway.
          #
          # `set -e` still earns its place: without it a failed `set image` would fall through to
          # `rollout status`, which would then report on the DEPLOYMENT THAT DID NOT CHANGE and
          # exit 0. The job would go green having deployed nothing.
          cat > /tmp/ssm-params.json <<JSON
          {
            "commands": [
              "set -eu",
              "kubectl set image deployment/omwa-api api=${IMAGE} migrate=${IMAGE}",
              "kubectl rollout status deployment/omwa-api --timeout=180s"
            ]
          }
          JSON

          # AWS-RunShellScript runs as root, so there is no sudo here -- which is also what lets
          # kubectl read k3s.yaml (0600, root-only). Verified that kubectl resolves on the box even
          # in a minimal environment, so SSM's shell will find it.
          cmd_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${IMAGE_TAG}" \
            --parameters file:///tmp/ssm-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $cmd_id"

          # ⚠️ send-command is ASYNCHRONOUS -- it returns as soon as the command is QUEUED. A job
          # that stopped here would report success for a rollout that had not started, let alone
          # finished: the same "green means queued, not done" trap as pushing a tag nothing pulls.
          status=Pending
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
                       --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          echo "--- remote stdout ---"
          aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          err=$(aws ssm get-command-invocation --command-id "$cmd_id" --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text 2>/dev/null || echo '')
          if [ -n "$err" ] && [ "$err" != "None" ]; then
            echo "--- remote stderr ---"
            echo "$err"
          fi

          if [ "$status" != "Success" ]; then
            echo "::error::SSM command finished with status ${status}"
            exit 1
          fi

      - name: Verify the ingress is serving this commit
        run: |
          set -uo pipefail
          for i in $(seq 1 24); do
            got=$(curl -fsS --max-time 10 https://api.omwanalytics.com/version \
                    | jq -r '.sha // empty' || true)
            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "✅ ingress is serving $got"
              exit 0
            fi
            echo "attempt $i/24: serving '${got:-<no response>}', want '$GITHUB_SHA'"
            sleep 5
          done
          echo "::error::Deploy reported success but the ingress never served $GITHUB_SHA."
          exit 1
